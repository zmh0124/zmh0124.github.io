<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Whether, What, Why: a research cycle for video anomaly understanding</title><desc id="desc">Whether detects anomalies through representation learning. What recognizes anomaly categories through vision-language models. Why evaluates evidence and model reliability. Evaluation and preference feedback guide the refinement of detection and semantic representations. Arrows describe the research agenda rather than one implemented pipeline.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#83949d"/></marker></defs><g font-family="Lato,Arial,Helvetica,sans-serif"><text x="500" y="29" text-anchor="middle" font-size="25" fill="#111" font-weight="700">Video Anomaly Detection &amp; Understanding</text><text x="500" y="56" text-anchor="middle" font-size="18" fill="#66717c" font-weight="400">A research cycle: detect, recognize, explain and refine</text><rect x="10" y="88" width="312" height="316" rx="22" fill="#e3f2dc"/><g transform="translate(89 122)" color="#3b7d23" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-17" y="-13" width="34" height="26" rx="3"/><path d="M-10-13V13M10-13V13M-17-5H-10M-17 5H-10M10-5H17M10 5H17"/><path d="M-4-7L6 0L-4 7Z" fill="currentColor" stroke="none"/></g><text x="187" y="132" text-anchor="middle" font-size="29" fill="#3b7d23" font-weight="700">Whether</text><text x="166" y="166" text-anchor="middle" font-size="16" fill="#66717c" font-weight="400">Is there an anomaly?</text><text x="166" y="199" text-anchor="middle" font-size="20" fill="#3b7d23" font-weight="700">Video Representation</text><text x="166" y="224" text-anchor="middle" font-size="20" fill="#3b7d23" font-weight="700">Learning</text><text x="166" y="257" text-anchor="middle" font-size="16" fill="#111" font-weight="400">Multi-scale spatio-temporal modeling</text><text x="166" y="278" text-anchor="middle" font-size="15" fill="#d00000" font-weight="400" font-style="italic">CVPR 2024 · Highlight</text><text x="166" y="305" text-anchor="middle" font-size="16" fill="#111" font-weight="400">Self-supervised learning</text><text x="166" y="326" text-anchor="middle" font-size="15" fill="#d00000" font-weight="400" font-style="italic">ACM MM 2024 · ICME 2025</text><text x="166" y="353" text-anchor="middle" font-size="16" fill="#111" font-weight="400">Generative normality modeling</text><text x="166" y="374" text-anchor="middle" font-size="15" fill="#d00000" font-weight="400" font-style="italic">IJCAI 2024 · Oral</text><path d="M324 122H340" fill="none" stroke="#83949d" stroke-width="2" marker-end="url(#arrow)"/><rect x="344" y="88" width="312" height="316" rx="22" fill="#fff0d9"/><g transform="translate(423 122)" color="#936018" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-13" width="16" height="26" rx="3"/><circle cx="-12" cy="-5" r="2"/><path d="M-18 8L-12 1L-6 8M-1 0H3"/><rect x="6" y="-13" width="17" height="26" rx="3"/><path d="M10-6H19M10 0H19M10 6H16"/></g><text x="521" y="132" text-anchor="middle" font-size="29" fill="#936018" font-weight="700">What</text><text x="500" y="166" text-anchor="middle" font-size="16" fill="#66717c" font-weight="400">What kind of anomaly is it?</text><text x="500" y="199" text-anchor="middle" font-size="20" fill="#936018" font-weight="700">Vision–Language</text><text x="500" y="224" text-anchor="middle" font-size="20" fill="#936018" font-weight="700">Fine-Grained Understanding</text><text x="500" y="257" text-anchor="middle" font-size="16" fill="#111" font-weight="400">Cross-granularity representation learning</text><text x="500" y="278" text-anchor="middle" font-size="15" fill="#d00000" font-weight="400" font-style="italic">Fine-VAD · CVPR 2026 · Highlight</text><text x="500" y="305" text-anchor="middle" font-size="16" fill="#111" font-weight="400">Abnormality-aware VLM adaptation</text><text x="500" y="326" text-anchor="middle" font-size="15" fill="#d00000" font-weight="400" font-style="italic">Alert-CLIP · CVPR 2026</text><text x="500" y="353" text-anchor="middle" font-size="16" fill="#111" font-weight="400">From anomaly scores to semantics</text><text x="500" y="374" text-anchor="middle" font-size="15" fill="#66717c" font-weight="400" font-style="italic">Category-level anomaly recognition</text><path d="M658 122H674" fill="none" stroke="#83949d" stroke-width="2" marker-end="url(#arrow)"/><rect x="678" y="88" width="312" height="316" rx="22" fill="#dfedfa"/><g transform="translate(757 122)" color="#215f9a" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-17" width="28" height="34" rx="3"/><path d="M-7-8H7M-7-2H3M-7 6L-2 11L8 1"/></g><text x="855" y="132" text-anchor="middle" font-size="29" fill="#215f9a" font-weight="700">Why</text><text x="834" y="166" text-anchor="middle" font-size="16" fill="#66717c" font-weight="400">What evidence supports the judgment?</text><text x="834" y="199" text-anchor="middle" font-size="20" fill="#215f9a" font-weight="700">Reliable Multimodal</text><text x="834" y="224" text-anchor="middle" font-size="20" fill="#215f9a" font-weight="700">Understanding</text><text x="834" y="257" text-anchor="middle" font-size="16" fill="#111" font-weight="400">Hallucination diagnosis &amp; mitigation</text><text x="834" y="278" text-anchor="middle" font-size="15" fill="#d00000" font-weight="400" font-style="italic">NeurIPS 2025</text><text x="834" y="305" text-anchor="middle" font-size="16" fill="#111" font-weight="400">Multi-level understanding evaluation</text><text x="834" y="326" text-anchor="middle" font-size="15" fill="#d00000" font-weight="400" font-style="italic">VALU · ACL 2026 · Oral</text><text x="834" y="353" text-anchor="middle" font-size="16" fill="#111" font-weight="400">Preference-based model optimization</text><text x="834" y="374" text-anchor="middle" font-size="15" fill="#d00000" font-weight="400" font-style="italic">IEEE TSC 2026</text><path d="M834 406V424Q834 442 816 442H184Q166 442 166 424V410" fill="none" stroke="#83949d" stroke-width="2.1" marker-end="url(#arrow)"/><text x="500" y="474" text-anchor="middle" font-size="17" fill="#66717c" font-weight="400">Evaluation &amp; preference feedback refine detection and semantic representations</text></g></svg>